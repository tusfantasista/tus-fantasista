name: Validate public site

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build production artifacts
        run: |
          ./scripts/build-festa60-production.sh
          ./scripts/build-fantasista-production.sh

      - name: Check links, assets, and fragments
        run: |
          node scripts/check-local-links.mjs public
          node scripts/check-local-links.mjs festa60-public
          node scripts/check-local-links.mjs fantasista-site/public

      - name: Check Cloudflare routing boundaries
        run: |
          node scripts/check-cloudflare-routing.mjs
          node scripts/check-cloudflare-protection.mjs
          node scripts/test-cloudflare-protection.mjs
          node scripts/test-festa60-video-metrics.mjs
          node scripts/test-festa60-page-metrics.mjs
          node scripts/test-festa60-donor-phone.mjs
          node scripts/test-festa60-coupons.mjs
          node scripts/test-festa60-crm-coupons.mjs
          node scripts/test-festa60-coupon-admin.mjs
          node scripts/test-festa60-coupon-redemptions.mjs
          node scripts/test-festa60-coupon-access.mjs
          node scripts/test-festa60-single-coupon-flow.mjs
          node scripts/test-festa60-coupon-pricing.mjs

      - name: Check JavaScript syntax
        run: |
          node --check public/_worker.js
          node --check public/assets/js/festa60-register.js
          node --check public/assets/js/site.js
          node --check public/assets/js/festa60-video-metrics.js
          node --check public/assets/js/festa60-video-stats.js
          node --check public/assets/js/festa60-page-metrics.js
          node --check public/assets/js/festa60-page-stats.js
          node --check public/assets/js/festa60-coupon-admin.js
          node --check public/festa60-page-metrics.js
          node --check public/festa60-coupons.js
          node --check public/festa60-coupon-access.js
          node --check scripts/check-cloudflare-routing.mjs
          node --check scripts/check-cloudflare-protection.mjs
          node --check scripts/test-cloudflare-protection.mjs
          node --check scripts/check-local-links.mjs
